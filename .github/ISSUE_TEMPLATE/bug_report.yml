name: Bug report
description: Something in the reconstruction behaves differently from the original game
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please run the game with `python scripts/play.py --debug` and attach the
        output. A release build strips null checks and dies silently; the debug
        build names the fault.
  - type: input
    id: where
    attributes:
      label: Where does it happen?
      placeholder: e.g. clicking New Career from the main menu
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What does the ORIGINAL game do here?
      description: This project reproduces the original, bugs included. Divergence from the original is the bug.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output from status/play_debug.txt
      render: text
  - type: input
    id: progress
    attributes:
      label: Output of `python scripts/progress.py` (first 3 lines)
